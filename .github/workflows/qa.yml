# QA 러너 자동 검사
# qa 폴더나 이 파일이 바뀐 커밋을 푸시하면 GitHub가 빌드·테스트를 돌리고,
# 판정·파이프라인 시험을 한 번씩 실행해 보고서를 결과물(Artifacts)로 첨부한다.
name: QA 러너 검사

on:
  push:
    branches: [main, "feature/**"]
    paths: ["qa/**", ".github/workflows/qa.yml"]
  pull_request:
    branches: [main]
    paths: ["qa/**", ".github/workflows/qa.yml"]
  # Actions 탭에서 버튼으로 직접 돌릴 수도 있게 한다
  workflow_dispatch:

jobs:
  qa:
    name: 빌드 · 테스트 · 시험 실행
    # 데스크탑 앱(WPF)이 Windows에서만 빌드되므로 Windows 환경을 쓴다
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa
        shell: pwsh

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: .NET 10 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 빌드
        run: dotnet build --configuration Release

      - name: QA 러너 테스트 (하나라도 실패하면 이 검사도 실패)
        run: dotnet test --configuration Release --no-build

      # 지금은 가짜 시험 대상이라 시험 실패(종료 코드 1)가 나오는 것이 정상이다.
      # 그래서 1은 통과로 보고, 채점을 시작하지 못한 경우(종료 코드 2)만 실패로 본다.
      # 실제 API·파이프라인을 연결하면 종료 코드 1도 실패로 바꾼다.
      - name: 판정 시험 실행
        run: |
          dotnet run --project src/QaRunner --configuration Release --no-build -- --suite verdict
          if ($LASTEXITCODE -eq 2) { exit 1 } else { exit 0 }

      - name: 파이프라인 시험 실행
        run: |
          dotnet run --project src/QaRunner --configuration Release --no-build -- --suite pipeline
          if ($LASTEXITCODE -eq 2) { exit 1 } else { exit 0 }

      # 부하·복구 시험은 실행안 기준(300초, 120초)이 길어서 CI에서는 짧게 돌려 동작만 확인한다
      - name: 부하 시험 실행 (10초 축소판)
        run: |
          dotnet run --project src/QaRunner --configuration Release --no-build -- --suite load --duration 10
          if ($LASTEXITCODE -eq 2) { exit 1 } else { exit 0 }

      - name: 복구 시험 실행 (20초 축소판, 5초 중단)
        run: |
          dotnet run --project src/QaRunner --configuration Release --no-build -- --suite recovery --duration 20 --stop-seconds 5
          if ($LASTEXITCODE -eq 2) { exit 1 } else { exit 0 }

      - name: 보고서 첨부
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa/reports/
          if-no-files-found: ignore
