log_format ticketguard escape=json '{"at":"$time_iso8601","request_id":"$request_id","source":"edge","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time,"upstream_status":"$upstream_status"}';
server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    access_log /var/log/nginx/access.jsonl ticketguard;
    error_log /var/log/nginx/error.log warn;
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
    }
}
