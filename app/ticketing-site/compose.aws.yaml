# Standalone AWS EC2 composition. Do not merge with compose.yaml.
services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - edge_logs:/var/log/nginx
    depends_on:
      - web
    restart: unless-stopped
  web:
    build: .
    expose:
      - "8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set EC2 address or domain}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set site origin}
      DJANGO_COOKIE_SECURE: "0"
      DJANGO_SSL_REDIRECT: "0"
      DJANGO_TRUST_PROXY_HEADERS: "1"
      POSTGRES_HOST: db
      POSTGRES_DB: ticketguard
      POSTGRES_USER: ticketguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      TG_RUN_ID: ${TG_RUN_ID:-baseline}
    volumes:
      - request_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketguard
      POSTGRES_USER: ticketguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketguard -d ticketguard"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
  request_logs:
  edge_logs:
