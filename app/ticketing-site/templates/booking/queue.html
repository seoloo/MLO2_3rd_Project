{% extends 'base.html' %}{% block content %}<main class="booking wrap"><section class="queuecenter"><div class="queueicon">♫</div><span class="eyebrow">GETTING YOUR SEAT READY</span><h1>좋은 순간을 위해,<br>잠시만 기다려 주세요.</h1><p>{{ show.name }} 예매 화면으로 연결하고 있어요.</p><div class="queueprogress"><i id="progress" style="width:10%"></i></div><strong id="remaining">입장 준비 중</strong><small>순서가 되면 자동으로 좌석 선택 화면으로 이동합니다.</small></section></main>{% endblock %}{% block scripts %}<script>const ready={{ ready_at }};const next='{% url "seats" show.slug %}';setInterval(()=>{let ms=Math.max(0,ready-Date.now());document.querySelector('#remaining').textContent=Math.ceil(ms/1000)+'초 후 입장';document.querySelector('#progress').style.width=Math.min(100,100-ms/30)+'%';if(!ms)location.replace(next)},250)</script>{% endblock %}
